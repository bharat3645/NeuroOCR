server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
        application/wasm text/javascript application/octet-stream;

    # The tfjs model.json + weight shards (frontend/public/models/) — content
    # is baked into the image at build time, so a new version always means a
    # new image tag. Safe to cache aggressively client-side.
    location /models/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Vite content-hashes its JS/CSS output filenames, so these are also
    # immutable for the lifetime of the image.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # react-router uses client-side (BrowserRouter) routing — any path that
    # isn't a real static file falls back to index.html so deep links like
    # /about resolve instead of 404ing at the server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
