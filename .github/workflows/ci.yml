name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Sanity-check the shipped tfjs model loads and predicts
        run: npm run verify-model

  training-syntax:
    name: Training scripts (syntax check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installing the real requirements.txt (TensorFlow + friends) is a
      # multi-GB, multi-minute dependency, and the full IAM dataset this
      # pipeline trains on isn't checked in either — running an actual
      # training job in CI isn't practical. py_compile still catches real
      # regressions cheaply: syntax errors, indentation mistakes, and
      # invalid f-strings introduced by an edit, without needing any of that.
      - name: Byte-compile training scripts
        run: python -m py_compile training/train_baseline.py training/train_ctc.py training/convert_to_tfjs.py
